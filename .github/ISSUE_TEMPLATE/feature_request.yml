name: Sugerir uma melhoria
description: Proponha uma melhoria de produto, documentação ou engenharia.
title: "[Melhoria]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
      description: Explique a necessidade antes de descrever a solução.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Descreva a experiência desejada e possíveis alternativas.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Princípios
      options:
        - label: A proposta mantém revisão humana do conteúdo jurídico.
          required: true
        - label: A proposta não exige expor dados sigilosos ou chaves no frontend.
          required: true
